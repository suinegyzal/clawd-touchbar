# v1.2.3 처럼 v로 시작하는 태그를 올리면 유니버설 앱을 빌드해 GitHub Release에 zip으로 올린다.
#   git tag v1.0.0 && git push origin v1.0.0
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15   # Swift 6 (BitwiseCopyable) 필요
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh universal
      - name: Zip
        run: ditto -c -k --keepParent build/ClawdPet.app ClawdPet.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ClawdPet.zip
          generate_release_notes: true
